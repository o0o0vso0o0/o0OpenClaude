# AI Cursor — local SearXNG for OpenClaude WebSearch
# Docs: https://docs.searxng.org/admin/installation-docker.html
name: openclaude-searxng

services:
  searxng:
    container_name: openclaude-searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    volumes:
      - ./core-config:/etc/searxng:rw
      - searxng-data:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:${SEARXNG_PORT:-8888}/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-openclaude-local-searxng-change-me}

volumes:
  searxng-data:
